name: Deploy Reasoning Agent to Vertex AI Agent Engine

on:
  push:
    branches:
      - main
    paths:
      - 'agent/**'
  workflow_dispatch:

env:
  PROJECT_ID: learn-agent-deployment
  REGION: europe-west3
  STAGING_BUCKET: gs://learn-agent-deployment-staging

jobs:
  deploy-agent:
    name: Deploy Agent Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'agent/requirements.txt'

      - name: Install Agent Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Deploy to Vertex AI Agent Engine
        run: |
          python agent/deploy.py --action deploy \
            --project ${{ env.PROJECT_ID }} \
            --location ${{ env.REGION }} \
            --bucket ${{ env.STAGING_BUCKET }} \
            --name adk-reasoning-agent
