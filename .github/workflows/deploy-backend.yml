name: Deploy Gateway to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  PROJECT_ID: learn-agent-deployment
  REGION: europe-west3
  SERVICE_NAME: agent-backend

jobs:
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --dockerfile backend/Dockerfile \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},GOOGLE_CLOUD_REGION=${{ env.REGION }},REASONING_ENGINE_ID=${{ secrets.REASONING_ENGINE_ID || 'projects/537728611405/locations/europe-west3/reasoningEngines/8179953094281396224' }},ALLOWED_USERS=${{ secrets.ALLOWED_USERS || 'iman.rahmani@gmail.com' }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || '537728611405-cgtolhfqij6fj514dbkjfv8atiqr4f6b.apps.googleusercontent.com' }}"
